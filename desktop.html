<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Windows 95 Desktop - Dundik Session</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "MS Sans Serif", Tahoma, Geneva, sans-serif;
            user-select: none;
        }

        body {
            background-color: #008080;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            position: relative;
        }

        /* Загрузочне вікно */
        .boot-modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #c0c0c0;
            border-top: 2px solid #ffffff;
            border-left: 2px solid #ffffff;
            border-right: 2px solid #000000;
            border-bottom: 2px solid #000000;
            width: 380px;
            padding: 3px;
            z-index: 999;
        }

        .win95-title {
            background: linear-gradient(90deg, #000080, #1084d0);
            color: white;
            padding: 3px 6px;
            font-weight: bold;
            font-size: 13px;
        }

        .progress-container {
            border-top: 2px solid #808080;
            border-left: 2px solid #808080;
            border-right: 2px solid #ffffff;
            border-bottom: 2px solid #ffffff;
            height: 22px;
            background: #ffffff;
            margin-top: 15px;
            padding: 2px;
            display: flex;
            gap: 2px;
        }

        .progress-block {
            width: 10px;
            height: 100%;
            background: #000080;
        }

        /* Робочий стіл */
        #desktop {
            display: none;
            height: calc(100vh - 34px);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: flex-start;
        }

        .icon {
            width: 75px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            cursor: pointer;
            color: white;
            font-size: 11px;
            text-shadow: 1px 1px 1px black;
            padding: 5px;
        }

        .icon:hover {
            background: rgba(0, 0, 128, 0.4);
            border: 1px dotted #ffffff;
        }

        .icon-img {
            font-size: 32px;
            margin-bottom: 4px;
        }

        /* Вікно програми Нотатки */
        .window {
            display: none;
            position: absolute;
            top: 100px;
            left: 150px;
            width: 400px;
            height: 300px;
            background: #c0c0c0;
            border-top: 2px solid #ffffff;
            border-left: 2px solid #ffffff;
            border-right: 2px solid #000000;
            border-bottom: 2px solid #000000;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.5);
            flex-direction: column;
            z-index: 100;
        }

        .window-header {
            background: linear-gradient(90deg, #000080, #1084d0);
            color: white;
            padding: 3px 6px;
            font-weight: bold;
            font-size: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .close-btn {
            background: #c0c0c0;
            border-top: 1px solid #ffffff;
            border-left: 1px solid #ffffff;
            border-right: 1px solid #000000;
            border-bottom: 1px solid #000000;
            width: 16px;
            height: 14px;
            font-size: 9px;
            line-height: 12px;
            text-align: center;
            color: black;
            font-weight: bold;
            cursor: pointer;
        }

        .notepad-textarea {
            width: 100%;
            height: 100%;
            background: #ffffff;
            border: none;
            outline: none;
            padding: 8px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 13px;
            resize: none;
        }

        /* Панель задач (Taskbar) */
        .taskbar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 34px;
            background: #c0c0c0;
            border-top: 2px solid #ffffff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 2px 4px;
            z-index: 1000;
        }

        .start-btn {
            background: #c0c0c0;
            border-top: 2px solid #ffffff;
            border-left: 2px solid #ffffff;
            border-right: 2px solid #000000;
            border-bottom: 2px solid #000000;
            padding: 2px 8px;
            font-weight: bold;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }

        .tray {
            border-top: 2px solid #808080;
            border-left: 2px solid #808080;
            border-right: 2px solid #ffffff;
            border-bottom: 2px solid #ffffff;
            padding: 3px 10px;
            font-size: 11px;
            background: #c0c0c0;
        }
    </style>
</head>
<body>

    <!-- 5-секундна розгрузка робочого столу -->
    <div class="boot-modal" id="desktopLoader">
        <div class="win95-title">Завантаження профілю користувача...</div>
        <div style="padding: 15px;">
            <p style="font-size: 12px;">Підготовка робочого столу для Dundik...</p>
            <div class="progress-container" id="progressContainer"></div>
        </div>
    </div>

    <!-- Робочий стіл -->
    <div id="desktop">
        <!-- Ярлик програми Нотатки -->
        <div class="icon" onclick="openNotepad()">
            <div class="icon-img">📝</div>
            <span>Нотатки</span>
        </div>
    </div>

    <!-- Вікно програми «Нотатки» -->
    <div class="window" id="notepadWindow">
        <div class="window-header">
            <span>📝 Блокнот - Записи квесту</span>
            <div class="close-btn" onclick="closeNotepad()">X</div>
        </div>
        <div style="flex: 1; padding: 2px; background: white;">
            <textarea class="notepad-textarea" placeholder="Тут ти можеш записувати підказки, коди та свої думки..."></textarea>
        </div>
    </div>

    <!-- Панель задач Windows 95 -->
    <div class="taskbar">
        <div class="start-btn">
            <span style="font-size: 14px;">🪟</span> <b>Start</b>
        </div>
        <div class="tray" id="clockTray">12:00 PM</div>
    </div>

    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(freq, duration = 0.08) {
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'square';
                osc.frequency.value = freq;
                gain.gain.value = 0.03;
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e) {}
        }

        // Завантаження десктопа (5 секунд)
        function initDesktop() {
            const container = document.getElementById('progressContainer');
            let step = 0;
            const totalSteps = 15;
            const intervalTime = 5000 / totalSteps;

            const interval = setInterval(() => {
                step++;
                const block = document.createElement('div');
                block.className = 'progress-block';
                container.appendChild(block);
                playSound(500 + (step * 25), 0.02);

                if (step >= totalSteps) {
                    clearInterval(interval);
                    document.getElementById('desktopLoader').style.display = 'none';
                    document.getElementById('desktop').style.display = 'flex';
                    playSound(900, 0.2);
                }
            }, intervalTime);
        }

        // Годинник справа внизу (Real-time clock)
        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            let minutes = now.getMinutes();
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12;
            hours = hours ? hours : 12;
            minutes = minutes < 10 ? '0' + minutes : minutes;
            document.getElementById('clockTray').innerText = hours + ':' + minutes + ' ' + ampm;
        }

        function openNotepad() {
            playSound(600, 0.05);
            document.getElementById('notepadWindow').style.display = 'flex';
        }

        function closeNotepad() {
            playSound(400, 0.05);
            document.getElementById('notepadWindow').style.display = 'none';
        }

        setInterval(updateClock, 1000);
        updateClock();
        initDesktop();
    </script>
</body>
</html>
